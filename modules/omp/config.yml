# OMP global settings, installed as ~/.omp/agent/config.yml by
# modules/omp/omp.nix on every switch (writable copy: omp flocks and
# rewrites this file at runtime). Runtime changes (/settings, model
# selector) persist until the next switch re-imposes this file.
setupVersion: 2
startup:
  quiet: true

modelRoles:
  default: openrouter/z-ai/glm-5.3-flash

# /model role assignments persist per repo (<cwd>/.omp/config.yml) instead
# of this global file, which every switch re-imposes.
modelRoleStorage: project

theme:
  dark: dark-tokyo-night
symbolPreset: nerd
composer:
  shape: box

lsp:
  diagnosticsOnEdit: true
  formatOnWrite: true

# Built-in github tool (shells out to gh; covers repo/PR/search/Actions).
github:
  enabled: true

# Cross-session memory (local backend; data lives under the agent dir,
# outside this file, so switches don't touch it).
memory:
  backend: local

# Redact credential-shaped tokens before provider requests.
secrets:
  enabled: true
